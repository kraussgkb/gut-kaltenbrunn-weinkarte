<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4eb">
<meta name="robots" content="noindex, nofollow">
<title>Wein entdecken · WINEFUNDAY</title>
<script defer src="/restaurant-bottle-cutouts.js?v=1"></script>
<script defer src="/wein/flasche.js?v=4"></script>
<style>
  :root { color-scheme: light; --paper:#f8f4eb; --ink:#291d19; --wine:#602b37; --green:#004438; --line:#d9cdbc; --muted:#654f44; }
  *, *::before, *::after { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; block-size:100%; overflow:hidden; overscroll-behavior:none; background:var(--paper); }
  body { color:var(--ink); font-family:system-ui,-apple-system,sans-serif; }
  main {
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto auto;
    gap:clamp(.45rem,1.5dvh,1rem);
    width:min(100%,31rem);
    height:100vh;
    height:100dvh;
    padding:max(env(safe-area-inset-top),.65rem) clamp(.9rem,5vw,2.25rem) max(env(safe-area-inset-bottom),.8rem);
    margin:auto;
    text-align:center;
  }
  header { display:flex; align-items:center; gap:1rem; }
  header::before, header::after { content:""; flex:1; height:1px; background:var(--line); }
  .logo { width:clamp(4.35rem,12dvh,6.4rem); aspect-ratio:1; object-fit:contain; }
  .bottle { position:relative; min-height:0; margin:0; }
  .bottle img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .origin { margin:0 0 .15rem; color:var(--muted); font-size:.83rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; }
  h1 { margin:0; font:500 clamp(1.7rem,7.8vw,2.65rem)/1.1 Georgia,serif; letter-spacing:-.045em; }
  h1.long { font-size:clamp(1.3rem,6vw,2.1rem); }
  .variety { margin:.2rem 0 0; color:var(--muted); font-size:.95rem; }
  nav { display:grid; gap:.42rem; text-align:left; }
  a { display:grid; grid-template-columns:1.6rem minmax(0,1fr); align-items:center; gap:.68rem; min-height:3.65rem; padding:.48rem .8rem; border:1px solid var(--line); color:var(--ink); background:#fffaf3; text-decoration:none; border-radius:.55rem; }
  a.primary { color:#fff; background:var(--green); border-color:var(--green); }
  a.shop { color:#fff; background:var(--wine); border-color:var(--wine); }
  a:focus-visible { outline:3px solid #ae713b; outline-offset:3px; }
  @media (hover:hover) { a:hover { box-shadow:0 2px 8px #291d1933; } }
  a:active { transform:translateY(1px); }
  a strong, a small { display:block; }
  a strong { font-size:1rem; line-height:1.22; }
  a small { margin-top:.16rem; font-size:.87rem; line-height:1.24; color:var(--muted); }
  a.primary small { color:#e6efea; }
  a.shop small { color:#faeaf0; }
  @media (max-height:630px) {
    main { gap:.38rem; }
    .logo { width:4.3rem; }
    a { min-height:3.12rem; padding-block:.36rem; }
    nav { gap:.34rem; }
  }
  svg { width:1.32rem; height:1.32rem; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<main>
  <header><img class="logo" src="/hofladen/winefunday-original.png" alt="WINEFUNDAY"></header>
  <figure class="bottle"><img id="bottle" alt="" hidden></figure>
  <section aria-labelledby="wine-name">
    <p class="origin" id="origin" hidden></p>
    <h1 id="wine-name" aria-live="polite">Wein wird geladen …</h1>
    <p class="variety" id="variety" hidden></p>
  </section>

  <nav aria-label="Diesen Wein entdecken">
    <a id="restaurant" class="primary" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v14M12 6C8 3 5 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-2-1-5-2-9 1Z"/></svg>
      <span><strong>Wein in der Weinkarte entdecken</strong><small>Wie er schmeckt und wozu er passt</small></span>
    </a>
    <a id="instagram" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="12" cy="12" r="3.7"/><path d="M17 7h.01"/></svg>
      <span><strong>Wein auf Instagram entdecken</strong><small id="instagram-subtitle">Zum Beitrag oder Highlight des Weins</small></span>
    </a>
    <a id="hofladen" class="shop" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1.5 12h-17L5 8Z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span><strong>Wein im Hofladen kaufen</strong><small id="shop-price"></small></span>
    </a>
    <a id="catalog" class="primary" href="/" hidden>Zur Weinkarte</a>
  </nav>
</main>
</body>
</html>
