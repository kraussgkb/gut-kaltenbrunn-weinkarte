name: Version core analytics loader
on:
  push:
    paths:
      - '.github/workflows/version-core-analytics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version analytics loader only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="analytics.js?v=20260917-1250" defer></script>'
          new='<script src="analytics.js?v=20260917-1300" defer></script>'
          if old not in s:
              raise SystemExit('Expected analytics loader not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit exact one-line loader change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Version inline engagement analytics loader'
          git push