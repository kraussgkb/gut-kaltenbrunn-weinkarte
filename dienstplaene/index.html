<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dienstpläne · Gut Kaltenbrunn</title><style>body{background:#f7f3eb;color:#004438;font-family:Arial,sans-serif;margin:0}main{max-width:560px;margin:50px auto;padding:24px}.brand{font-size:24px;font-weight:bold;letter-spacing:3px}h1{font-size:30px;margin-top:40px}p{line-height:1.6}.plan{display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border:1px solid #ddd7cb;border-radius:16px;margin:14px 0;padding:24px;color:inherit;text-decoration:none}.plan span{font-size:14px}small{display:block;margin-top:35px;color:#65746e}</style></head><body><main><div class="brand">WINEFUNDAY</div><h1 id="title">Dienstpläne</h1><p id="dates"></p><section id="plans">Dienstpläne werden geladen …</section><small>Gut Kaltenbrunn · Service &amp; Stewarding</small></main><script>
const next=location.pathname.includes('naechste-woche');document.getElementById('title').textContent='Dienstpläne';
function weekAt(now){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(now).map(x=>[x.type,x.value]));const d=new Date(Date.UTC(+parts.year,+parts.month-1,+parts.day));if(d.getUTCDay()===1&&+parts.hour<6)d.setUTCDate(d.getUTCDate()-1);const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()-day+1+(next?7:0));const monday=new Date(d);d.setUTCDate(d.getUTCDate()+3);const year=d.getUTCFullYear(),first=new Date(Date.UTC(year,0,4));first.setUTCDate(first.getUTCDate()+3-((first.getUTCDay()+6)%7));return{year,week:1+Math.round((d-first)/604800000),monday};}
async function render(){const x=weekAt(new Date()),following=new Date(x.monday);following.setUTCDate(following.getUTCDate()+7);const d=new Date(following);d.setUTCDate(d.getUTCDate()+3);const year=d.getUTCFullYear(),first=new Date(Date.UTC(year,0,4));first.setUTCDate(first.getUTCDate()+3-((first.getUTCDay()+6)%7));const nextWeek=1+Math.round((d-first)/604800000);document.getElementById('dates').textContent='Aktuelle und nächste Woche · Bitte Dienstplan auswählen';try{const r=await fetch('/dienstplaene/plaene.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json(),box=document.getElementById('plans');box.replaceChildren();for(const department of ['Service','Stewarding'])for(const period of [{year:x.year,week:x.week},{year,week:nextWeek}]){const plan=data.plans.find(p=>p.department===department&&p.year===period.year&&p.week===period.week);const node=document.createElement(plan?'a':'div');node.className='plan';if(plan){node.href=plan.url;node.target='_blank';node.rel='noopener';}const name=document.createElement('strong');name.textContent=department+' KW'+period.week+' '+String(period.year).slice(-2);const hint=document.createElement('span');hint.textContent=plan?'PDF öffnen ↗':'Noch nicht veröffentlicht';node.append(name,hint);box.append(node);}}catch{document.getElementById('plans').textContent='Dienstpläne konnten nicht geladen werden. Bitte erneut versuchen.'}}
render();setInterval(render,60000);
</script></body></html>
