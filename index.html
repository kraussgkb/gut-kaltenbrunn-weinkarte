<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004438"><title>Weinkarte · Gut Kaltenbrunn</title><style>
:root{--g:#004438;--s:#b0b3b2;--iv:#f4f4f2;--ink:#26332f;--white:#fff;--line:#d5d8d7;--shadow:0 18px 45px rgba(35,48,44,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--iv);color:var(--ink);font-family:Candara,Optima,"Segoe UI",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{background:var(--s);color:var(--g);border-bottom:4px solid var(--g)}.head{min-height:112px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:14px}.logo-link{display:inline-flex;align-items:center;color:inherit;text-decoration:none}.logo-link:focus-visible{outline:2px solid var(--g);outline-offset:4px}.brand-logo{width:72px;height:72px;object-fit:contain}.wordmark{font-family:Georgia,"Times New Roman",serif;letter-spacing:.12em;font-size:13px;line-height:1.4}.wine-title{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:clamp(32px,5vw,58px);font-weight:400;transform:rotate(-2deg);white-space:nowrap}.award{justify-self:end;display:flex;align-items:center;gap:10px}.award img{max-width:92px;max-height:64px;object-fit:contain}.award-fallback{border:1px solid rgba(0,68,56,.55);padding:9px 11px;font-size:10px;letter-spacing:.14em;text-align:center;color:var(--g)}.hero{background:#e3e5e4;color:var(--g);padding:62px 0 72px}.hero-grid{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:34px;align-items:center;text-align:center}.hero-logo{max-width:130px;max-height:110px;object-fit:contain;margin:auto}.hero-logo-link{display:flex;align-items:center;justify-content:center}.quote{border:0;padding:0;max-width:900px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5vw,58px);line-height:1.18;letter-spacing:.035em;text-transform:uppercase}.quote small{display:block;margin-top:28px;color:var(--g);text-transform:none}.quote-name{display:block;font-family:"Segoe Print","Bradley Hand",cursive;font-size:clamp(25px,3vw,38px);font-weight:400;letter-spacing:.02em}.quote-role{display:block;font-family:Candara,Optima,"Segoe UI",Arial,sans-serif;font-size:clamp(15px,1.7vw,20px);font-weight:600;line-height:1.4;margin-top:5px;letter-spacing:.05em}.filters{margin-top:-24px;position:relative;z-index:2}.filter-card{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow)}.search{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 4px 17px;font:17px Candara,Optima,"Segoe UI",Arial,sans-serif;color:var(--ink);outline:none}.selects{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.selects select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:12px 10px;font:14px Candara,Optima,"Segoe UI",Arial,sans-serif}.resultbar{display:flex;justify-content:space-between;align-items:center;padding:32px 2px 18px}.resultbar b{font-weight:400;color:#66716e}.reset{border:0;background:none;color:var(--g);font:14px Candara,Optima,"Segoe UI",Arial,sans-serif;text-decoration:underline;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:64px}.card{display:flex;flex-direction:column;background:#fff;color:inherit;text-decoration:none;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(0,68,56,.08);transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.pic{height:280px;background:#eef0ee;display:flex;align-items:center;justify-content:center;padding:20px}.pic img{max-height:100%;max-width:92%;object-fit:contain}.pic.missing:before,.bottle.missing:before{content:"BILD FOLGT";display:grid;place-items:center;width:150px;height:210px;border:1px solid #aeb5b2;color:#66716e;letter-spacing:.16em;font-size:11px;background:#f7f7f5}.txt{padding:22px;display:flex;flex-direction:column;flex:1}.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}.card h2{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;line-height:1.1;margin:9px 0 14px}.producer{margin:0;color:#5d6865}.quick{display:grid;grid-template-columns:1fr auto;gap:8px 14px;border-top:1px solid var(--line);margin-top:auto;padding-top:16px}.quick span{color:#68716f}.quick strong{color:var(--g);font-size:19px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#68716f}.detail{padding:38px 0 70px}.back{display:inline-block;color:var(--g);margin-bottom:24px}.detail-card{display:grid;grid-template-columns:minmax(320px,42%) 1fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.bottle{min-height:460px;background:#eef0ee;display:flex;align-items:center;justify-content:center;padding:28px}.bottle img{max-height:410px;max-width:92%;object-fit:contain}.content{padding:clamp(30px,5vw,64px)}.content h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,72px);font-weight:400;line-height:1;margin:10px 0 12px}.lead{font-size:19px;color:#596562;margin:0 0 22px}.core{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0;margin-bottom:26px}.core strong{font-size:25px;color:var(--g)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{border:1px solid var(--line);border-radius:9px;padding:14px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.ico{width:30px;height:30px;border:1px solid var(--g);border-radius:50%;display:grid;place-items:center;color:var(--g);font-family:serif}.fact small{display:block;color:#42504c;font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:5px}.sections{grid-column:1/-1;margin-top:0;padding:8px clamp(30px,5vw,64px) 38px}.sections section{border-top:1px solid var(--line);padding:20px 0;line-height:1.65}.sections h3{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:400;color:var(--g);margin:0 0 7px}.tasting-note{background:#f2f4f3;border:1px solid var(--line);border-radius:10px;padding:22px!important;margin-bottom:12px}.signature{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:21px;color:var(--g);margin-top:14px}footer{background:var(--s);border-top:4px solid var(--g);padding:22px;text-align:center}footer .footer-logo{width:58px;height:58px;object-fit:contain;display:block;margin:auto}@media(max-width:900px){.hero-grid{grid-template-columns:90px minmax(0,1fr) 90px;gap:15px}.hero-logo{max-width:82px;max-height:76px}.detail-card{grid-template-columns:1fr}.selects{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.bottle{min-height:340px}.bottle img{max-height:300px}}@media(max-width:580px){.shell{width:min(100% - 22px,1180px)}.hero{padding-top:38px}.hero-grid{grid-template-columns:60px minmax(0,1fr) 60px;gap:8px}.hero-logo{max-width:56px;max-height:54px}.quote{margin-top:10px;font-size:clamp(22px,7vw,34px)}.selects,.grid,.facts{grid-template-columns:1fr}.filter-card{padding:15px}.pic{height:240px}.content{padding:28px 22px}.core{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><footer><a class="logo-link" href="https://www.feinkost-kaefer.de/pages/gutkaltenbrunn" target="_blank" rel="noopener noreferrer" aria-label="Gut Kaltenbrunn bei Feinkost Käfer öffnen"><img class="footer-logo" src="Weinbilder/logo-gut-kaltenbrunn.png" alt="Gut Kaltenbrunn" data-fallbacks="logo-gut-kaltenbrunn.png,images/logo-gut-kaltenbrunn.png" onerror="F(this)"></a></footer><script>function F(x){let a=x.dataset.fallbacks.split(','),i=+(x.dataset.i||0);if(i<a.length){x.dataset.i=i+1;x.src=a[i]}else{x.onerror=null;x.style.display='none'}}function P(x){x.onerror=null;x.style.display='none';x.parentElement.classList.add('missing')}let wines=[],catalog=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const field=(w,k,d='—')=>esc(w[k]||d);function options(key){const vals=key==='grapes'?catalog.flatMap(w=>String(w.grapes||'').split(',').map(x=>x.trim()).filter(Boolean)):catalog.map(w=>w[key]).filter(Boolean);return [...new Set(vals)].sort((a,b)=>String(a).localeCompare(String(b),'de')).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function card(w){return '<a class="card" href="?id='+encodeURIComponent(w.id)+'"><div class="pic"><img src="'+esc(w.image)+'" alt="'+field(w,'name')+'" onerror="P(this)"></div><div class="txt"><span class="tag">'+field(w,'category')+'</span><h2>'+field(w,'name')+'</h2><p class="producer">'+field(w,'producer')+'</p><div class="quick"><span>'+field(w,'year')+' · '+field(w,'size')+'</span><strong>'+field(w,'price')+'</strong></div></div></a>'}function fact(icon,label,value){return '<div class="fact"><span class="ico">'+icon+'</span><div><small>'+label+'</small><b>'+esc(value||'—')+'</b></div></div>'}function extra(w){const rows=[['≈','GESCHMACK',w.taste],['%','ALKOHOL',w.alcohol?String(w.alcohol)+' %':null],['°','SERVIERTEMPERATUR',w.temperature],['↗','TRINKREIFE',w.maturity],['⌛','LAGERPOTENZIAL',w.potential],['◇','FASSART',w.barrel],['△','BODENTYP',w.soil],['V','VEGAN / BIO',w.organic],['!','ALLERGENE',w.allergens],['★','AUSZEICHNUNGEN',w.awards],['P','PARKER',w.parker],['F','FALSTAFF',w.falstaff],['W','WINE SPECTATOR',w.spectator],['D','DECANTER',w.decanter]].filter(x=>x[2]!==undefined&&x[2]!==null&&x[2]!=='');return rows.length?'<section><h3>Weitere Weindetails</h3><div class="facts">'+rows.map(x=>fact(x[0],x[1],x[2])).join('')+'</div></section>':''}function detail(w){return '<main class="detail"><div class="shell"><a class="back" href="./">← Zur Weinkarte</a><article class="detail-card"><div class="bottle"><img src="'+esc(w.image)+'" alt="'+field(w,'name')+'" onerror="P(this)"></div><div class="content"><span class="tag">'+field(w,'category')+'</span><h1>'+field(w,'name')+'</h1><p class="lead">'+field(w,'producer')+'</p><div class="core"><span>Jahrgang <b>'+field(w,'year')+'</b></span><span>'+field(w,'size')+'</span><strong>'+field(w,'price')+'</strong></div><div class="facts">'+fact('⌖','HERKUNFT',(w.region||'')+', '+(w.country||''))+fact('◌','REBSORTEN',w.grapes)+fact('◫','FLASCHE',w.size)+fact('◇','AUSBAU',w.aging)+'</div></div><div class="sections"><section class="tasting-note"><h3>Meine Verkostungsnotiz</h3><p>'+field(w,'note')+'</p><div class="signature">Dominik Krauß</div><small>Sommelier & Betriebsleiter · Gut Kaltenbrunn</small></section><section><h3>Sensorik</h3><p>'+field(w,'sensory')+'</p></section><section><h3>Speiseempfehlung</h3><p>'+field(w,'pairing')+'</p></section>'+extra(w)+'</div></article></div></main>'}function list(){return '<main><section class="hero"><div class="shell hero-grid"><a class="hero-logo-link" href="https://www.feinkost-kaefer.de/pages/gutkaltenbrunn" target="_blank" rel="noopener noreferrer" aria-label="Gut Kaltenbrunn öffnen"><img class="hero-logo" src="Weinbilder/logo-gut-kaltenbrunn.png" alt="Gut Kaltenbrunn" data-fallbacks="logo-gut-kaltenbrunn.png,images/logo-gut-kaltenbrunn.png" onerror="F(this)"></a><div class="quote">„ICH KANN WEIN VERSCHWINDEN LASSEN.<br>WAS IST IHRE SUPERKRAFT?“<small><span class="quote-name">Dominik Krauß</span><span class="quote-role">Sommelier &amp; Betriebsleiter Gut Kaltenbrunn</span></small></div><div class="hero-logo-link"><img class="hero-logo" src="Weinbilder/star-wine-list.webp" alt="Star Wine List" data-fallbacks="star-wine-list.webp,images/star-wine-list.webp" onerror="F(this)"></div></div></section><section class="filters"><div class="shell filter-card"><input class="search" id="q" placeholder="Wein, Produzent oder Jahrgang suchen …"><div class="selects"><select id="category"><option value="">Alle Kategorien</option>'+options('category')+'</select><select id="country"><option value="">Alle Länder</option>'+options('country')+'</select><select id="region"><option value="">Alle Regionen</option>'+options('region')+'</select><select id="producer"><option value="">Alle Produzenten</option>'+options('producer')+'</select><select id="grapes"><option value="">Alle Rebsorten</option>'+options('grapes')+'</select></div></div></section><section class="shell"><div class="resultbar"><b id="count"></b><button class="reset" id="reset">Filter zurücksetzen</button></div><div id="grid" class="grid"></div></section></main>'}function init(){const keys=['category','country','region','producer','grapes'],q=document.getElementById('q'),grid=document.getElementById('grid'),count=document.getElementById('count');function render(){const term=q.value.trim().toLowerCase(),f=keys.reduce((o,k)=>(o[k]=document.getElementById(k).value,o),{}),rows=catalog.filter(w=>(!term||(w.name+' '+w.producer+' '+w.year+' '+w.region+' '+w.grapes).toLowerCase().includes(term))&&keys.every(k=>!f[k]||(k==='grapes'?String(w[k]||'').split(',').map(x=>x.trim()).includes(f[k]):w[k]===f[k])));grid.innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">Keine Weine für diese Auswahl gefunden.</div>';count.textContent=rows.length+' '+(rows.length===1?'Wein':'Weine')}q.addEventListener('input',render);keys.forEach(k=>document.getElementById(k).addEventListener('change',render));document.getElementById('reset').onclick=()=>{q.value='';keys.forEach(k=>document.getElementById(k).value='');render()};render()}async function start(){const app=document.getElementById('app');try{const r=await fetch('wines.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);wines=await r.json();catalog=wines.filter(w=>w.active===true&&String(w.price||'').trim()!=='');const id=new URLSearchParams(location.search).get('id'),wine=catalog.find(x=>x.id===id);app.innerHTML=id?(wine?detail(wine):'<main class="detail"><div class="shell"><h1>Wein nicht gefunden</h1><a class="back" href="./">Zur Weinkarte</a></div></main>'):list();if(!id)init()}catch(e){app.innerHTML='<main class="detail"><div class="shell"><h1>Weinkarte wird geladen</h1><p>Die Datei wines.json fehlt oder ist noch nicht veröffentlicht.</p></div></main>'}}start();</script></body></html>
