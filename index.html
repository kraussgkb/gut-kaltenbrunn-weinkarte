<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004438"><title>Weinkarte · Gut Kaltenbrunn</title><style>
:root{--g:#004438;--s:#b0b3b2;--iv:#f7f4ed;--ink:#26332f;--white:#fff;--line:#d5d8d7;--sage:#e3e8e5;--gold:#b3772d;--shadow:0 18px 45px rgba(35,48,44,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--iv);color:var(--ink);font-family:Candara,Optima,"Segoe UI",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{background:var(--s);color:var(--g);border-bottom:4px solid var(--g)}.head{min-height:112px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:14px}.logo-link{display:inline-flex;align-items:center;color:inherit;text-decoration:none}.logo-link:focus-visible{outline:2px solid var(--g);outline-offset:4px}.brand-logo{width:72px;height:72px;object-fit:contain}.wordmark{font-family:Georgia,"Times New Roman",serif;letter-spacing:.12em;font-size:13px;line-height:1.4}.wine-title{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:clamp(32px,5vw,58px);font-weight:400;transform:rotate(-2deg);white-space:nowrap}.award{justify-self:end;display:flex;align-items:center;gap:10px}.award img{max-width:92px;max-height:64px;object-fit:contain}.award-fallback{border:1px solid rgba(0,68,56,.55);padding:9px 11px;font-size:10px;letter-spacing:.14em;text-align:center;color:var(--g)}.hero{background:linear-gradient(135deg,#e1e5e3,#d2dad7);color:var(--g);padding:62px 0 72px;border-bottom:1px solid #c3ceca}.hero-grid{display:grid;grid-template-columns:180px minmax(0,1fr) 180px;gap:34px;align-items:center;text-align:center}.hero-logo{max-width:165px;max-height:140px;object-fit:contain;margin:auto}.hero-logo-link{display:flex;align-items:center;justify-content:center}.quote{border:0;padding:0;max-width:900px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,4.2vw,50px);line-height:1.12;letter-spacing:.035em;text-transform:uppercase}.quote-line{display:flex;width:100%;justify-content:center;align-items:center;white-space:nowrap;text-align:center}.quote-divider{display:flex;align-items:center;justify-content:center;width:70px;height:54px;margin:20px auto 0;position:relative}.grape-leaf{position:absolute;top:2px;left:34px;width:17px;height:11px;border-radius:100% 0 100% 0;background:var(--g);transform:rotate(-28deg);opacity:.78}.grape-stem{position:absolute;top:9px;left:33px;width:2px;height:12px;background:var(--gold);transform:rotate(10deg)}.grapes{display:grid;grid-template-columns:repeat(3,8px);gap:2px;margin-top:14px}.grapes i{display:block;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.grapes i:nth-child(1){grid-column:2}.grapes i:nth-child(2){grid-column:1}.grapes i:nth-child(6){grid-column:2}.quote small{display:block;margin-top:18px;color:var(--g);text-transform:none}.quote-name{display:block;font-family:"Segoe Print","Bradley Hand",cursive;font-size:clamp(25px,3vw,38px);font-weight:400;letter-spacing:.02em}.quote-role{display:block;font-family:Candara,Optima,"Segoe UI",Arial,sans-serif;font-size:clamp(15px,1.7vw,20px);font-weight:600;line-height:1.4;margin-top:5px;letter-spacing:.05em}.filters{margin-top:-24px;position:relative;z-index:2}.filter-card{background:#fff;border:1px solid #c8d2ce;border-top:4px solid var(--g);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.search{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 4px 17px;font:17px Candara,Optima,"Segoe UI",Arial,sans-serif;color:var(--ink);outline:none}.selects{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.selects select{width:100%;border:1px solid #bcc9c4;border-radius:8px;background:#fafbf9;color:var(--ink);padding:12px 10px;font:14px Candara,Optima,"Segoe UI",Arial,sans-serif}.resultbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:32px 2px 18px}.result-actions{display:flex;align-items:center;gap:14px}.view-toggle{display:flex;border:1px solid #bcc9c4;border-radius:7px;overflow:hidden;background:#fff}.view-btn{border:0;background:#fff;color:var(--g);padding:8px 12px;font:13px Candara,Optima,"Segoe UI",Arial,sans-serif;cursor:pointer}.view-btn+ .view-btn{border-left:1px solid #bcc9c4}.view-btn.active{background:var(--g);color:#fff}.view-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}.resultbar b{font-weight:400;color:#66716e}.reset{border:0;background:none;color:var(--g);font:14px Candara,Optima,"Segoe UI",Arial,sans-serif;text-decoration:underline;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 28px;padding-bottom:64px}.card{display:flex;flex-direction:column;background:#fff;color:inherit;text-decoration:none;border:1px solid #d8d8d8;border-radius:11px;overflow:hidden;box-shadow:0 5px 18px rgba(31,59,45,.06);transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(31,59,45,.13);border-color:#9fb1aa}.pic{height:280px;background:#f2f1ec;border-top:6px solid var(--gold);display:flex;align-items:center;justify-content:center;padding:22px;position:relative}.pic img{max-height:100%;max-width:92%;object-fit:contain}.pic.missing:before,.bottle.missing:before{content:"";display:block;width:150px;height:210px;border:1px solid #c7cbc9;background-color:#f8f7f3;background-image:url("Weinbilder/logo-gut-kaltenbrunn.png");background-repeat:no-repeat;background-position:center 54px;background-size:82px auto;opacity:.28}.pic.missing:after,.bottle.missing:after{content:"BILD FOLGT";position:absolute;left:50%;top:50%;transform:translate(-50%,48px);color:#42544d;letter-spacing:.18em;font-size:11px;font-weight:700;white-space:nowrap}.bottle.missing{position:relative}.txt{padding:24px 24px 22px;display:flex;flex-direction:column;flex:1}.tag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--g);border-radius:3px;padding:5px 9px}.card h2{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400;line-height:1.12;color:#24372f;margin:15px 0 11px}.producer-line{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:25px;margin:0;color:var(--g)}.producer{margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.country-code{flex:0 0 auto;background:var(--g);color:#fff;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:700;letter-spacing:.1em}.quick{display:grid;grid-template-columns:1fr auto;gap:8px 14px;border-top:1px solid var(--line);margin-top:12px;padding-top:14px}.quick span{color:#8b908e;font-size:14px}.quick strong{color:#24372f;font-size:20px;font-weight:800}.list-view{display:flex;flex-direction:column;gap:9px;padding-bottom:64px}.list-card{display:grid;grid-template-columns:130px minmax(220px,1.7fr) minmax(170px,1fr) 55px 180px 100px;gap:16px;align-items:center;background:#fff;border:1px solid #d8d8d8;border-left:5px solid var(--gold);border-radius:8px;padding:16px 18px;color:inherit;text-decoration:none;transition:.2s}.list-card:hover{border-color:#9fb1aa;box-shadow:0 8px 22px rgba(31,59,45,.09);transform:translateX(3px)}.list-cat{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g)}.list-name{font:21px Georgia,"Times New Roman",serif;color:#24372f}.list-producer{font-weight:700;color:var(--g)}.list-meta{color:#7e8582;font-size:14px}.list-price{text-align:right;font-size:19px;font-weight:800;color:#24372f}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#68716f}.detail{padding:38px 0 70px}.back{display:inline-block;color:var(--g);margin-bottom:24px}.detail-card{display:grid;grid-template-columns:minmax(320px,42%) 1fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.bottle{min-height:460px;background:#eef0ee;display:flex;align-items:center;justify-content:center;padding:28px}.bottle img{max-height:410px;max-width:92%;object-fit:contain}.content{padding:clamp(30px,5vw,64px)}.content h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,72px);font-weight:400;line-height:1;margin:10px 0 12px}.lead{font-size:19px;color:#596562;margin:0 0 22px}.core{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0;margin-bottom:26px}.core strong{font-size:25px;color:var(--g)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{border:1px solid var(--line);border-radius:9px;padding:14px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.ico{width:30px;height:30px;border:1px solid var(--g);border-radius:50%;display:grid;place-items:center;color:var(--g);font-family:serif}.fact small{display:block;color:#42504c;font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:5px}.sections{grid-column:1/-1;margin-top:0;padding:8px clamp(30px,5vw,64px) 38px}.sections section{border-top:1px solid var(--line);padding:20px 0;line-height:1.65}.sections h3{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:400;color:var(--g);margin:0 0 7px}.tasting-note{background:#f2f4f3;border:1px solid var(--line);border-radius:10px;padding:22px!important;margin-bottom:12px}.signature{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:21px;color:var(--g);margin-top:14px}footer{background:var(--s);border-top:4px solid var(--g);padding:22px;text-align:center}footer .footer-logo{width:82px;height:82px;object-fit:contain;display:block;margin:auto}@media(max-width:900px){.list-card{grid-template-columns:100px minmax(180px,1.5fr) minmax(140px,1fr) 48px 140px 85px;gap:10px;padding:14px}.hero-grid{grid-template-columns:110px minmax(0,1fr) 110px;gap:15px}.hero-logo{max-width:105px;max-height:94px}.detail-card{grid-template-columns:1fr}.selects{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.bottle{min-height:340px}.bottle img{max-height:300px}}@media(max-width:580px){.shell{width:min(100% - 22px,1180px)}.hero{padding-top:38px}.hero-grid{grid-template-columns:72px minmax(0,1fr) 72px;gap:8px}.hero-logo{max-width:68px;max-height:64px}.quote{margin-top:10px;font-size:clamp(17px,5.1vw,27px)}.quote-divider{margin-top:14px;transform:scale(.86)}.quote-line:first-child{transform:translateX(0)}.resultbar{align-items:flex-start}.result-actions{flex-direction:column;align-items:flex-end;gap:8px}.view-btn{padding:8px 9px}.list-card{grid-template-columns:1fr auto;gap:5px 10px;padding:14px 15px}.list-cat,.list-producer,.list-meta{grid-column:1}.list-name{grid-column:1;font-size:19px}.list-country{grid-column:2;grid-row:1}.list-price{grid-column:2;grid-row:4;text-align:right}.selects,.grid,.facts{grid-template-columns:1fr}.filter-card{padding:15px}.pic{height:240px}.content{padding:28px 22px}.core{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><footer><a class="logo-link" href="https://www.feinkost-kaefer.de/pages/gutkaltenbrunn" target="_blank" rel="noopener noreferrer" aria-label="Gut Kaltenbrunn bei Feinkost Käfer öffnen"><img class="footer-logo" src="Weinbilder/logo-gut-kaltenbrunn.png" alt="Gut Kaltenbrunn" data-fallbacks="logo-gut-kaltenbrunn.png,images/logo-gut-kaltenbrunn.png" onerror="F(this)"></a></footer><script>function F(x){let a=x.dataset.fallbacks.split(','),i=+(x.dataset.i||0);if(i<a.length){x.dataset.i=i+1;x.src=a[i]}else{x.onerror=null;x.style.display='none'}}function P(x){x.onerror=null;x.style.display='none';x.parentElement.classList.add('missing')}let wines=[],catalog=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const field=(w,k,d='—')=>esc(w[k]||d);function cc(c){c=String(c||'').toLowerCase();return c.includes('deutsch')?'DE':c.includes('österreich')?'AT':c.includes('frank')?'FR':c.includes('ital')?'IT':c.includes('span')?'ES':c.includes('usa')||c.includes('verein')?'US':'—'}function options(key){const vals=key==='grapes'?catalog.flatMap(w=>String(w.grapes||'').split(',').map(x=>x.trim()).filter(Boolean)):catalog.map(w=>w[key]).filter(Boolean);return [...new Set(vals)].sort((a,b)=>String(a).localeCompare(String(b),'de')).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function listCard(w){return '<a class="list-card" href="?id='+encodeURIComponent(w.id)+'"><span class="list-cat">'+field(w,'category')+'</span><strong class="list-name">'+field(w,'name')+'</strong><span class="list-producer">'+field(w,'producer','Produzent nicht angegeben')+'</span><span class="country-code list-country">'+cc(w.country)+'</span><span class="list-meta">'+field(w,'year')+' · '+field(w,'size')+'</span><strong class="list-price">'+field(w,'price')+'</strong></a>'}function card(w){return '<a class="card" href="?id='+encodeURIComponent(w.id)+'"><div class="pic"><img src="'+esc(w.image)+'" alt="'+field(w,'name')+'" onerror="P(this)"></div><div class="txt"><span class="tag">'+field(w,'category')+'</span><h2>'+field(w,'name')+'</h2><div class="producer-line"><p class="producer">'+field(w,'producer','Produzent nicht angegeben')+'</p><span class="country-code">'+cc(w.country)+'</span></div><div class="quick"><span>'+field(w,'year')+' · '+field(w,'size')+'</span><strong>'+field(w,'price')+'</strong></div></div></a>'}function fact(icon,label,value){return '<div class="fact"><span class="ico">'+icon+'</span><div><small>'+label+'</small><b>'+esc(value||'—')+'</b></div></div>'}function extra(w){const rows=[['≈','GESCHMACK',w.taste],['%','ALKOHOL',w.alcohol?String(w.alcohol)+' %':null],['°','SERVIERTEMPERATUR',w.temperature],['↗','TRINKREIFE',w.maturity],['⌛','LAGERPOTENZIAL',w.potential],['◇','FASSART',w.barrel],['△','BODENTYP',w.soil],['V','VEGAN / BIO',w.organic],['!','ALLERGENE',w.allergens],['★','AUSZEICHNUNGEN',w.awards],['P','PARKER',w.parker],['F','FALSTAFF',w.falstaff],['W','WINE SPECTATOR',w.spectator],['D','DECANTER',w.decanter]].filter(x=>x[2]!==undefined&&x[2]!==null&&x[2]!=='');return rows.length?'<section><h3>Weitere Weindetails</h3><div class="facts">'+rows.map(x=>fact(x[0],x[1],x[2])).join('')+'</div></section>':''}function detail(w){return '<main class="detail"><div class="shell"><a class="back" href="./">← Zur Weinkarte</a><article class="detail-card"><div class="bottle"><img src="'+esc(w.image)+'" alt="'+field(w,'name')+'" onerror="P(this)"></div><div class="content"><span class="tag">'+field(w,'category')+'</span><h1>'+field(w,'name')+'</h1><p class="lead">'+field(w,'producer')+'</p><div class="core"><span>Jahrgang <b>'+field(w,'year')+'</b></span><span>'+field(w,'size')+'</span><strong>'+field(w,'price')+'</strong></div><div class="facts">'+fact('⌖','HERKUNFT',(w.region||'')+', '+(w.country||''))+fact('◌','REBSORTEN',w.grapes)+fact('◫','FLASCHE',w.size)+fact('◇','AUSBAU',w.aging)+'</div></div><div class="sections"><section class="tasting-note"><h3>Meine Verkostungsnotiz</h3><p>'+field(w,'note')+'</p><div class="signature">Dominik Krauß</div><small>Sommelier & Betriebsleiter · Gut Kaltenbrunn</small></section><section><h3>Sensorik</h3><p>'+field(w,'sensory')+'</p></section><section><h3>Speiseempfehlung</h3><p>'+field(w,'pairing')+'</p></section>'+extra(w)+'</div></article></div></main>'}function list(){return '<main><section class="hero"><div class="shell hero-grid"><a class="hero-logo-link" href="https://www.feinkost-kaefer.de/pages/gutkaltenbrunn" target="_blank" rel="noopener noreferrer" aria-label="Gut Kaltenbrunn öffnen"><img class="hero-logo" src="Weinbilder/logo-gut-kaltenbrunn.png" alt="Gut Kaltenbrunn" data-fallbacks="logo-gut-kaltenbrunn.png,images/logo-gut-kaltenbrunn.png" onerror="F(this)"></a><div class="quote"><span class="quote-line">„ICH KANN WEIN</span><span class="quote-line">VERSCHWINDEN LASSEN.</span><span class="quote-line">WAS IST IHRE</span><span class="quote-line">SUPERKRAFT?“</span><span class="quote-divider" aria-hidden="true"><span class="grape-leaf"></span><span class="grape-stem"></span><span class="grapes"><i></i><i></i><i></i><i></i><i></i><i></i></span></span><small><span class="quote-name">Dominik Krauß</span><span class="quote-role">Sommelier &amp; Betriebsleiter Gut Kaltenbrunn</span></small></div><div class="hero-logo-link"><img class="hero-logo" src="Weinbilder/star-wine-list.webp" alt="Star Wine List" data-fallbacks="star-wine-list.webp,images/star-wine-list.webp" onerror="F(this)"></div></div></section><section class="filters"><div class="shell filter-card"><input class="search" id="q" placeholder="Wein, Produzent oder Jahrgang suchen …"><div class="selects"><select id="category"><option value="">Alle Kategorien</option>'+options('category')+'</select><select id="country"><option value="">Alle Länder</option>'+options('country')+'</select><select id="region"><option value="">Alle Regionen</option>'+options('region')+'</select><select id="producer"><option value="">Alle Produzenten</option>'+options('producer')+'</select><select id="grapes"><option value="">Alle Rebsorten</option>'+options('grapes')+'</select></div></div></section><section class="shell"><div class="resultbar"><b id="count"></b><div class="result-actions"><div class="view-toggle" role="group" aria-label="Ansicht wählen"><button class="view-btn active" id="tiles" type="button" aria-pressed="true">▦ Kacheln</button><button class="view-btn" id="listView" type="button" aria-pressed="false">☷ Liste</button></div><button class="reset" id="reset">Filter zurücksetzen</button></div></div><div id="grid" class="grid"></div></section></main>'}function init(){const keys=['category','country','region','producer','grapes'],q=document.getElementById('q'),grid=document.getElementById('grid'),count=document.getElementById('count'),tiles=document.getElementById('tiles'),listBtn=document.getElementById('listView');let mode='tiles';function render(){const term=q.value.trim().toLowerCase(),f=keys.reduce((o,k)=>(o[k]=document.getElementById(k).value,o),{}),rows=catalog.filter(w=>(!term||(w.name+' '+w.producer+' '+w.year+' '+w.region+' '+w.grapes).toLowerCase().includes(term))&&keys.every(k=>!f[k]||(k==='grapes'?String(w[k]||'').split(',').map(x=>x.trim()).includes(f[k]):w[k]===f[k])));grid.className=mode==='tiles'?'grid':'list-view';grid.innerHTML=rows.length?rows.map(mode==='tiles'?card:listCard).join(''):'<div class="empty">Keine Weine für diese Auswahl gefunden.</div>';count.textContent=rows.length+' '+(rows.length===1?'Wein':'Weine')}function setMode(m){mode=m;tiles.classList.toggle('active',m==='tiles');listBtn.classList.toggle('active',m==='list');tiles.setAttribute('aria-pressed',m==='tiles');listBtn.setAttribute('aria-pressed',m==='list');render()}tiles.onclick=()=>setMode('tiles');listBtn.onclick=()=>setMode('list');q.addEventListener('input',render);keys.forEach(k=>document.getElementById(k).addEventListener('change',render));document.getElementById('reset').onclick=()=>{q.value='';keys.forEach(k=>document.getElementById(k).value='');render()};render()}async function start(){const app=document.getElementById('app');try{const r=await fetch('wines.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);wines=await r.json();catalog=wines.filter(w=>w.active===true&&String(w.price||'').trim()!=='');const id=new URLSearchParams(location.search).get('id'),wine=catalog.find(x=>x.id===id);app.innerHTML=id?(wine?detail(wine):'<main class="detail"><div class="shell"><h1>Wein nicht gefunden</h1><a class="back" href="./">Zur Weinkarte</a></div></main>'):list();if(!id)init()}catch(e){app.innerHTML='<main class="detail"><div class="shell"><h1>Weinkarte wird geladen</h1><p>Die Datei wines.json fehlt oder ist noch nicht veröffentlicht.</p></div></main>'}}start();</script></body></html>
