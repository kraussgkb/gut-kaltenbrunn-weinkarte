sen, Geflügel in Sahnesauce, Risotto","aging":"Edelstahl + Reserve","note":"Die Heritage-Linie von Laurent-Perrier - ein Tribut an die Geschichte des Hauses. Goldgelb mit feiner Perlage. Komplexe Aromen von reifen Früchten, Brioche und dezenter Würze. Am Gaumen vollmundig und elegant mit langer Persistenz.","sensory":"Auge: Goldgelb, feine Perlage. Nase: Reife Früchte, Brioche, Würze. Gaumen: Vollmundig, elegant, komplex.","image":"images/CH803-1-NV.png"},{"id":"CH805-1-NV","category":"Champagner","name":"Cuvée Rosé","year":"NV","producer":"Laurent-Perrier","region":"Champagne","country":"🇫🇷 Frankreich","grapes":"Pinot Noir","size":"Fl. 0,75l","price":"155,00 €","pairing":"Lachs (geräuchert oder gegrillt), Entenbrust, Taubenbrust, Lamm rosa, rote Früchte, asiatische Küche","aging":"Edelstahl","note":"Der ikonische Rosé-Champagner, der die Kategorie definiert hat. Durch Mazeration von Pinot Noir entstanden - keine Assemblage! Lachsrosa mit kupfernen Reflexen. Intensive Aromen von frischen roten Beeren, Himbeeren, Erdbeeren und einem Hauch Rose. Am Gaumen vollmundig aber elegant, mit seidiger Textur und langem, fruchtigen Abgang.","sensory":"Auge: Lachsrosa mit kupfernen Reflexen. Nase: Himbeere, Erdbeere, rote Johannisbeere, Rose. Gaumen: Vollmundig, seidig, fruchtig, elegant.","image":"images/CH805-1-NV.jpg"},{"id":"CH805-2-NV","category":"Champagner","name":"Cuvée Rosé","year":"NV","producer":"Laurent-Perrier","region":"Champagne","country":"🇫🇷 Frankreich","grapes":"Pinot Noir","size":"Fl. 1,50l","price":"335,00 €","pairing":"Lachs (geräuchert oder gegrillt), Entenbrust, Taubenbrust, Lamm rosa, rote Früchte, asiatische Küche","aging":"Edelstahl","note":"Der ikonische Rosé-Champagner, der die Kategorie definiert hat. Durch Mazeration von Pinot Noir entstanden - keine Assemblage! Lachsrosa mit kupfernen Reflexen. Intensive Aromen von frischen roten Beeren, Himbeeren, Erdbeeren und einem Hauch Rose. Am Gaumen vollmundig aber elegant, mit seidiger Textur und langem, fruchtigen Abgang.","sensory":"Auge: Lachsrosa mit kupfernen Reflexen. Nase: Himbeere, Erdbeere, rote Johannisbeere, Rose. Gaumen: Vollmundig, seidig, fruchtig, elegant.","image":"images/CH805-2-NV.jpg"},{"id":"CH805-3-NV","category":"Champagner","name":"Cuvée Rosé","year":"NV","producer":"Laurent-Perrier","region":"Champagne","country":"🇫🇷 Frankreich","grapes":"Pinot Noir","size":"Fl. 3,00l","price":"999,00 €","pairing":"Lachs (geräuchert oder gegrillt), Entenbrust, Taubenbrust, Lamm rosa, rote Früchte, asiatische Küche","aging":"Edelstahl","note":"Der ikonische Rosé-Champagner, der die Kategorie definiert hat. Durch Mazeration von Pinot Noir entstanden - keine Assemblage! Lachsrosa mit kupfernen Reflexen. Intensive Aromen von frischen roten Beeren, Himbeeren, Erdbeeren und einem Hauch Rose. Am Gaumen vollmundig aber elegant, mit seidiger Textur und langem, fruchtigen Abgang.","sensory":"Auge: Lachsrosa mit kupfernen Reflexen. Nase: Himbeere, Erdbeere, rote Johannisbeere, Rose. Gaumen: Vollmundig, seidig, fruchtig, elegant.","image":"images/CH805-3-NV.jpg"}];const esc=s=>String(s??'');function card(w){return `<a class="card" href="?id=${encodeURIComponent(w.id)}"><div class="pic"><img src="${w.image}" alt="${esc(w.name)}"></div><div class="txt"><span class="tag">${esc(w.category)}</span><h2>${esc(w.name)}</h2><p>${esc(w.producer)} · ${esc(w.year)}</p><strong>${esc(w.price)}</strong></div></a>`}function detail(w){return `<main class="detail"><a class="back" href="./">← Zur Weinkarte</a><article><div class="bottle"><img src="${w.image}" alt="${esc(w.name)}"></div><div class="content"><span class="tag">${esc(w.category)}</span><h1>${esc(w.name)}</h1><p>${esc(w.producer)} · ${esc(w.year)}</p><p class="price">${esc(w.price)}</p><div class="facts"><div><small>HERKUNFT</small><b>${esc(w.region)}, ${esc(w.country)}</b></div><div><small>REBSORTEN</small><b>${esc(w.grapes)}</b></div><div><small>FLASCHE</small><b>${esc(w.size)}</b></div><div><small>AUSBAU</small><b>${esc(w.agin
