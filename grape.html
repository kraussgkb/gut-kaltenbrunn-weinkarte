"<!doctype html><html lang=""de""><head><meta charset=""utf-8""><meta name=""viewport"" content=""width=device-width,initial-scale=1""><meta name=""theme-color"" content=""#004438""><title>Rebsortenwissen · Gut Kaltenbrunn</title><style>:root{--g:#004438;--gold:#C28A2C;--bg:#F9F6F3;--ink:#26332f;--line:#d5d8d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Candara,Optima,""Segoe UI"",Arial,sans-serif}.shell{width:min(900px,calc(100% - 32px));margin:auto}.top{padding:24px 0 14px}.back{color:var(--g);text-decoration:none;font-size:14px}.hero{padding:26px 0 30px;border-bottom:1px solid var(--line)}.tag{display:inline-block;background:var(--g);color:#fff;border-radius:4px;padding:5px 9px;font-size:10px;letter-spacing:.12em}.hero h1{font:500 clamp(38px,7vw,68px)/1 Georgia,serif;color:var(--g);margin:14px 0 8px}.syn{color:#69736f;font-size:15px}.intro{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:28px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card.wide{grid-column:1/-1}.card small{display:block;color:var(--g);font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:7px}.card p{margin:0;line-height:1.55}.sources{padding:4px 0 45px}.sources a{display:block;color:var(--g);font-size:13px;margin:6px 0;overflow-wrap:anywhere}@media(max-width:600px){.intro{grid-template-columns:1fr}.card.wide{grid-column:auto}.hero h1{font-size:42px}}</style></head><body><div class=""shell""><div class=""top""><a class=""back"" href=""javascript:history.back()"">← Zurück zum Wein</a></div><main id=""app""></main></div><script>const e=s=>String(s??'').replace(/[&<>""']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','""':'&quot;',""'"":'&#39;'}[m])),box=(l,v,w='')=>'<section class=""card '+w+'""><small>'+l+'</small><p>'+e(v||'—')+'</p></section>';fetch('grapes.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{const n=new URLSearchParams(location.search).get('name'),g=x.find(v=>v.name===n),a=document.querySelector('#app');if(!g){a.innerHTML='<div class=""hero""><h1>Rebsorte nicht gefunden</h1></div>';return}a.innerHTML='<div class=""hero""><span class=""tag"">REBSORTENWISSEN</span><h1>'+e(g.name)+'</h1><div class=""syn"">'+e(g.synonyms||'Keine gebräuchlichen Synonyme')+'</div></div><div class=""intro"">'+box('FARBE',g.color)+box('HERKUNFT',g.origin)+box('TYPISCHE AROMEN',g.aromas,'wide')+box('SÄURE',g.acidity)+box('KÖRPER',g.body)+box('KLIMA & ANBAU',g.climate,'wide')+box('BEKANNTE REGIONEN',g.regions,'wide')+box('AUSBAU & STIL',g.style,'wide')+box('SPEISENEMPFEHLUNG',g.food,'wide')+box('GESCHICHTE & BESONDERHEIT',g.history,'wide')+'</div><div class=""sources""><h3>Quellen</h3><a href=""'+e(g.source1)+'"" target=""_blank"" rel=""noopener"">'+e(g.source1)+'</a><a href=""'+e(g.source2)+'"" target=""_blank"" rel=""noopener"">'+e(g.source2)+'</a></div>'}).catch(()=>document.querySelector('#app').innerHTML='<div class=""hero""><h1>Rebsortenwissen wird geladen</h1><p>grapes.json fehlt oder ist noch nicht veröffentlicht.</p></div>');</script></body></html>
