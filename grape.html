<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004438"><title>Rebsortenwissen · Gut Kaltenbrunn</title><style>:root{--g:#004438;--gold:#C28A2C;--bg:#F9F6F3;--ink:#26332f;--line:#d5d8d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Candara,Optima,"Segoe UI",Arial,sans-serif}.shell{width:min(900px,calc(100% - 32px));margin:auto}.top{padding:24px 0 14px}.back{color:var(--g);text-decoration:none;font-size:14px}.hero{padding:26px 0 30px;border-bottom:1px solid var(--line)}.tag{display:inline-block;background:var(--g);color:#fff;border-radius:4px;padding:5px 9px;font-size:10px;letter-spacing:.12em}.hero h1{font:500 clamp(38px,7vw,68px)/1 Georgia,serif;color:var(--g);margin:14px 0 8px}.hero p,.syn{color:#69736f;font-size:15px}.intro{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:28px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card.wide{grid-column:1/-1}.card small{display:block;color:var(--g);font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:7px}.card p{margin:0;line-height:1.55}.sources{padding:4px 0 45px}.sources a{display:block;color:var(--g);font-size:13px;margin:6px 0;overflow-wrap:anywhere}.error{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);padding:18px;margin-top:25px}@media(max-width:600px){.intro{grid-template-columns:1fr}.card.wide{grid-column:auto}.hero h1{font-size:42px}}</style></head><body><div class="shell"><div class="top"><a class="back" id="back" href="index.html">← Zurück zur Weinkarte</a></div><main id="app"><div class="hero"><h1>Rebsortenwissen</h1><p>Profil wird geladen …</p></div></main></div><script>(function(){var app=document.getElementById('app'),params=new URLSearchParams(window.location.search),name=params.get('name')||'',wine=params.get('wine')||'',back=document.getElementById('back');back.href=wine?'index.html?id='+encodeURIComponent(wine):'index.html';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function box(label,value,wide){return'<section class="card '+(wide?'wide':'')+'"><small>'+label+'</small><p>'+esc(value||'—')+'</p></section>'}function norm(v){return String(v||'').toLowerCase().replace(/^\s+|\s+$/g,'')}fetch('grapes.json?v=20260829-1100',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){var g=null,i,j,syn;for(i=0;i<data.length;i++){if(norm(data[i].name)===norm(name)){g=data[i];break}syn=String(data[i].synonyms||'').split(',');for(j=0;j<syn.length;j++){if(norm(syn[j])===norm(name)){g=data[i];break}}if(g)break}if(!g){app.innerHTML='<div class="hero"><h1>Rebsorte nicht gefunden</h1><p>Gesucht: '+esc(name||'keine Rebsorte übergeben')+'</p></div>';return}document.title=g.name+' · Rebsortenwissen';app.innerHTML='<div class="hero"><span class="tag">REBSORTENWISSEN</span><h1>'+esc(g.name)+'</h1><div class="syn">'+esc(g.synonyms||'Keine gebräuchlichen Synonyme')+'</div></div><div class="intro">'+box('FARBE',g.color)+box('HERKUNFT',g.origin)+box('TYPISCHE AROMEN',g.aromas,1)+box('SÄURE',g.acidity)+box('KÖRPER',g.body)+box('KLIMA & ANBAU',g.climate,1)+box('BEKANNTE REGIONEN',g.regions,1)+box('AUSBAU & STIL',g.style,1)+box('SPEISENEMPFEHLUNG',g.food,1)+box('GESCHICHTE & BESONDERHEIT',g.history,1)+'</div><div class="sources"><h3>Quellen</h3>'+(g.source1?'<a href="'+esc(g.source1)+'" target="_blank" rel="noopener">'+esc(g.source1)+'</a>':'')+(g.source2?'<a href="'+esc(g.source2)+'" target="_blank" rel="noopener">'+esc(g.source2)+'</a>':'')+'</div>'}).catch(function(err){app.innerHTML='<div class="hero"><h1>Rebsortenwissen konnte nicht geladen werden</h1></div><div class="error"><b>grapes.json fehlt oder ist nicht gültig.</b><p>'+esc(err.message)+'</p></div>'})})();</script></body></html>
