<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004438"><title>Standort · Weinkeller</title><style>body{margin:0;background:#F9F6F3;color:#26332f;font-family:Candara,Optima,"Segoe UI",Arial,sans-serif}.shell{width:min(900px,calc(100% - 28px));margin:35px auto}.back{color:#004438}.card{margin-top:20px;background:#fff;border:1px solid #d5d8d7;border-radius:16px;padding:24px}h1{font:400 38px Georgia,serif;color:#004438;margin:8px 0}.loc{margin:18px 0;padding:15px;border-left:4px solid #b3772d;background:#faf9f5}.loc b{display:block;color:#004438;font-size:20px}.map{min-height:360px;border:1px dashed #aebbb6;border-radius:12px;display:grid;place-items:center;text-align:center;padding:25px;color:#68736f;background:#fbfcfb}@media(max-width:580px){.shell{margin-top:18px}.map{min-height:280px}}</style></head><body><main class="shell"><a class="back" id="back" href="./">← Zurück zum Wein</a><article class="card"><small>WEINKELLER · STANDORT</small><h1 id="title">Standort</h1><div id="loc"></div><div class="map" id="map">Die fotografische Keller-/Regalansicht wird hier eingebunden.<br>Das passende Regal und die Ebene werden automatisch hervorgehoben.</div></article></main><script>const id=new URLSearchParams(location.search).get('id');back.href='./'+(id?'?id='+encodeURIComponent(id):'');Promise.all([fetch('../wines.json').then(r=>r.json()),fetch('./locations.json').then(r=>r.json())]).then(([wines,locations])=>{const w=wines.find(x=>x.id===id);if(w)title.textContent=[w.name,w.year].filter(Boolean).join(' · ');const a=Array.isArray(locations[id])?locations[id]:[];loc.innerHTML=a.length?a.map(x=>'<div class="loc"><b>'+x.place+' · '+x.rack+' · Ebene '+x.level+'</b><span>'+x.code+'</span></div>').join(''):'<div class="loc"><b>Lagerort noch nicht erfasst</b></div>'})</script></body></html>
