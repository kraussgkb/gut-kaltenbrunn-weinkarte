<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#004438"><title>Weinkeller · Gut Kaltenbrunn</title><style>
:root{--g:#004438;--iv:#F9F6F3;--ink:#26332f;--gold:#b3772d;--line:#d5d8d7;--shadow:0 18px 45px rgba(35,48,44,.10)}*{box-sizing:border-box}body{margin:0;background:var(--iv);color:var(--ink);font-family:Candara,Optima,"Segoe UI",Arial,sans-serif}.shell{width:min(900px,calc(100% - 28px));margin:auto}.hero{text-align:center;padding:38px 0 30px}.hero img{width:130px;height:130px;object-fit:contain}.hero h1{font:400 clamp(34px,6vw,50px) Georgia,serif;color:var(--g);margin:8px 0}.hero p{color:#66716e}.search-card{background:#fff;border:1px solid #c8d2ce;border-top:4px solid var(--g);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.search-wrap{position:relative}.search{width:100%;border:1px solid #bcc9c4;border-radius:11px;padding:15px 46px 15px 16px;font-family:Candara,Optima,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.25;color:var(--ink);outline:none}.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:24px;color:#60716a;cursor:pointer}.results{margin-top:10px}.suggestion{width:100%;text-align:left;background:#fff;border:0;border-top:1px solid #e7eae8;padding:13px;cursor:pointer}.suggestion b{display:block;color:var(--g);font-size:16px}.suggestion span{color:#66716e;font-size:13px}.detail{margin:22px 0 55px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.bottle{min-height:330px;display:flex;align-items:center;justify-content:center;padding:26px;border-bottom:1px solid var(--line)}.bottle img{max-height:300px;max-width:88%;object-fit:contain}.content{padding:25px}.tag{display:inline-block;background:var(--g);color:#fff;border-radius:3px;padding:5px 9px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.content h2{font:400 clamp(30px,6vw,46px) Georgia,serif;color:#24372f;margin:12px 0 7px}.lead{color:#596562;margin:0 0 13px}.core{display:flex;flex-wrap:wrap;gap:10px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0}.article{padding:13px 0;border-bottom:1px solid var(--line);color:#596562}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.fact{border:1px solid var(--line);border-radius:8px;padding:11px}.fact small{display:block;color:#65706c;font-size:10px;font-weight:700;letter-spacing:.09em;margin-bottom:4px}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.section h3{font:400 20px Georgia,serif;color:var(--g);margin:0 0 8px}.section p{line-height:1.6}.actions{display:grid;gap:10px;margin-top:22px}.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:14px 16px;font-weight:700}.inside{background:var(--g);color:#fff}.cellar{background:#fff;color:var(--g);border:2px solid var(--g)}.order{background:var(--gold);color:#fff}.location{margin-top:15px;padding:14px;border-left:4px solid var(--gold);background:#faf9f5;border-radius:5px}.location b{display:block;color:var(--g)}.empty{text-align:center;padding:25px;color:#68716f}.admin{display:block;text-align:center;margin:25px;color:var(--g);font-size:12px}@media(max-width:580px){html,body{width:100%;max-width:100%;overflow-x:hidden}.shell{width:calc(100% - 22px);max-width:100%}.search{font-size:16px!important}.hero{padding:24px 0 18px}.hero img{width:105px;height:105px}.search-card{padding:15px}.facts{grid-template-columns:1fr}.detail{margin-top:15px}.bottle{min-height:270px}.bottle img{max-height:245px}.content{padding:22px}}
</style></head><body><main class="shell"><header class="hero"><img src="../Weinbilder/logo-gut-kaltenbrunn.png" alt="Gut Kaltenbrunn"><h1>Weinkeller</h1><p>Interne Weinsuche · Gut Kaltenbrunn</p></header><section class="search-card"><div class="search-wrap"><input id="q" class="search" autocomplete="off" placeholder="Wein, Produzent, Jahrgang oder Artikelnummer suchen …"><button id="clear" class="clear" aria-label="Suche löschen">×</button></div><div id="results" class="results"></div></section><div id="detail"></div><a class="admin" href="./admin/">Admin-Bereich</a></main><script>
let wines=[],locations={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const V=v=>v!=null&&String(v).trim()&&!['—','-'].includes(String(v).trim());const val=(w,k)=>V(w[k])?esc(w[k]):'—';function loc(id){return Array.isArray(locations[id])?locations[id]:[]}
async function start(){try{const [w,l]=await Promise.all([fetch('../wines.json',{cache:'no-store'}),fetch('./locations.json',{cache:'no-store'})]);wines=(await w.json()).filter(x=>x.active===true);locations=await l.json()}catch(e){results.innerHTML='<div class="empty">Daten konnten nicht geladen werden.</div>'}}
function render(){const t=q.value.trim().toLowerCase();detail.innerHTML='';if(t.length<3){results.innerHTML='';return}const rows=wines.filter(w=>([w.id,w.name,w.producer,w.year].join(' ')).toLowerCase().includes(t)).slice(0,8);results.innerHTML=rows.length?rows.map(w=>'<button class="suggestion" data-id="'+esc(w.id)+'"><b>'+val(w,'name')+'</b><span>'+[w.producer,w.year,w.id].filter(V).map(esc).join(' · ')+'</span></button>').join(''):'<div class="empty">Kein Wein gefunden.</div>'}
function fact(label,v){return V(v)?'<div class="fact"><small>'+label+'</small><b>'+esc(v)+'</b></div>':''}
function show(w){q.blur();q.value=[w.name,w.producer,w.year].filter(V).join(' ');results.innerHTML='';const ls=loc(w.id);detail.innerHTML='<article class="detail"><div class="bottle"><img src="'+esc(w.image||'')+'" alt="'+val(w,'name')+'"></div><div class="content">'+(V(w.category)?'<span class="tag">'+esc(w.category)+'</span>':'')+'<h2>'+val(w,'name')+'</h2><p class="lead">'+val(w,'producer')+'</p><div class="core">'+[w.year,w.size,w.price].filter(V).map(x=>'<b>'+esc(x)+'</b>').join('<span>·</span>')+'</div><div class="article">Artikelnummer: <b>'+val(w,'id')+'</b></div><div class="facts">'+fact('HERKUNFT',[w.region,w.country].filter(V).join(', '))+fact('REBSORTEN',w.grapes)+fact('AUSBAU',w.aging)+fact('TRINKREIFE',w.maturity)+'</div>'+(V(w.note)?'<section class="section"><h3>Meine Verkostungsnotiz</h3><p>'+esc(w.note)+'</p></section>':'')+(V(w.pairing)?'<section class="section"><h3>Speiseempfehlung</h3><p>'+esc(w.pairing)+'</p></section>':'')+(ls.length?ls.map(x=>'<div class="location"><b>'+esc(x.place)+' · '+esc(x.rack)+' · Ebene '+esc(x.level)+'</b><small>'+esc(x.code)+'</small></div>').join(''):'<div class="location"><b>Lagerort noch nicht erfasst</b></div>')+'<div class="actions"><a class="btn inside" href="../index.html?id='+encodeURIComponent(w.id)+'">WINEFUNDAY INSIDE</a><a class="btn inside" href="https://winefunday-drucktest.dominik511618.chatgpt.site/bestellen?wein='+encodeURIComponent(w.id)+'">JETZT DIREKT BESTELLEN</a><a class="btn cellar" href="./standort.html?id='+encodeURIComponent(w.id)+'">STANDORT IM WEINKELLER ANZEIGEN</a></div></div></article>';requestAnimationFrame(()=>document.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'start'}))}
q.addEventListener('input',render);clear.onclick=()=>{q.value='';results.innerHTML='';detail.innerHTML='';q.focus()};results.onclick=e=>{const b=e.target.closest('[data-id]');if(b){const w=wines.find(x=>x.id===b.dataset.id);if(w)show(w)}};start();
</script></body></html>
