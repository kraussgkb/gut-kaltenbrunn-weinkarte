<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004438"><title>Winefunday Insight</title><style>:root{--g:#004438;--s:#b0b3b2;--iv:#F9F6F3;--ink:#26332f;--white:#fff;--line:#d5d8d7;--sage:#e3e8e5;--gold:#b3772d;--shadow:0 18px 45px rgba(35,48,44,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--iv);color:var(--ink);font-family:Candara,Optima,"Segoe UI",Arial,sans-serif;line-height:1.65}.shell{width:min(940px,calc(100% - 32px));margin:auto}.topbar{padding:24px 0}.back{color:var(--g);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.12em}.hero{padding:42px 0 54px;text-align:center}.brand{color:var(--g);font-size:15px;font-weight:700;letter-spacing:.28em}.brand strong{display:block;font-size:36px;line-height:1.05;letter-spacing:.16em}.claim{margin:12px 0 42px;color:#697571;font-size:11px;letter-spacing:.16em}.producer{margin:0;color:#65716d;font-size:16px}.hero h1{margin:12px 0 10px;color:var(--g);font-family:Optima,Candara,"Segoe UI",Arial,sans-serif;font-size:clamp(34px,7vw,68px);font-weight:500;line-height:.98;letter-spacing:.04em}.meta{color:#65716d;letter-spacing:.08em}.rule{height:1px;background:var(--line);margin:38px 0 0}main{padding-bottom:64px}.section{padding:48px 0;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 20px;color:var(--g);font-size:12px;font-weight:700;letter-spacing:.16em}.radar-wrap{width:min(680px,100%);margin:auto}.radar-wrap svg{display:block;width:100%;height:auto;overflow:visible}.radar-note{text-align:center;color:#6b7672;font-size:12px}.reading{max-width:760px;margin:26px auto 0;padding:20px 24px;background:rgba(227,232,229,.55);border-left:2px solid var(--g)}.reading h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:var(--g)}.reading p{margin:0;color:#58635f;font-size:14px}.impression{max-width:780px;margin:auto;font-family:Optima,Candara,"Segoe UI",Arial,sans-serif;font-size:clamp(20px,3vw,28px);line-height:1.55;color:#34443f}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{padding:8px 13px;border:1px solid #bfc8c4;border-radius:999px;color:#42524d;font-size:13px}.aroma-grid,.facts-grid,.closing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:22px;background:rgba(255,255,255,.55);border-top:2px solid var(--g)}.card small{display:block;margin-bottom:10px;color:#6a7571;font-size:11px;font-weight:700;letter-spacing:.12em}.card p{margin:0}.facts-grid{grid-template-columns:repeat(2,1fr)}.fact-block{padding:20px 0;border-top:1px solid var(--line)}.fact-block strong{display:block;color:var(--g);font-size:20px;font-weight:500}.finale{margin-top:48px;padding:38px;background:var(--g);color:var(--white);box-shadow:var(--shadow)}.finale .eyebrow{color:#dbe7e2}.finale blockquote{margin:0 0 30px;font-family:Optima,Candara,"Segoe UI",Arial,sans-serif;font-size:clamp(20px,3vw,28px);line-height:1.5}.perfect{display:grid;grid-template-columns:1fr 2fr;gap:24px;border-top:1px solid rgba(255,255,255,.28);padding-top:24px}.perfect strong{font-size:12px;letter-spacing:.13em}.perfect ul{margin:0;padding-left:18px}.bottom-nav{padding:34px 0;text-align:center}.bottom-nav a{display:inline-block;padding:11px 18px;border:1px solid var(--g);color:var(--g);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.12em}.empty{padding:100px 0;text-align:center}.empty h1{color:var(--g);font-weight:500}.empty a{display:inline-block;margin-top:20px;padding:11px 18px;border:1px solid var(--g);color:var(--g);text-decoration:none}@media(max-width:700px){.hero{padding-top:22px}.brand strong{font-size:30px}.section{padding:38px 0}.aroma-grid,.facts-grid,.closing-grid,.perfect{grid-template-columns:1fr}.finale{padding:28px 22px}.radar-label{font-size:10px}}</style></head><body><div class="shell"><div class="topbar"><a class="back" id="backTop" href="index.html?id=CH806-1-NV">← ZURÜCK ZUM WEIN</a></div><div id="app"></div></div><script>const insights={"CH806-1-NV":{producer:"Laurent-Perrier",title:["GRAND SIÈCLE","ITÉRATION N°26"],meta:"Champagne · 0,75 l",radar:{"FRUCHT":8,"FRISCHE":9,"SÄURE":8,"KÖRPER":7,"STRUKTUR":6,"HOLZ":3,"WÜRZE":6,"KOMPLEXITÄT":10},impression:"Grand Siècle N°26 ist für mich einer dieser Champagner, bei denen nicht Kraft, sondern Präzision beeindruckt. Zitrone und Clementine kommen zuerst, danach Haselnuss, Mandel, etwas Honig und diese sehr feine mineralische Spannung. Seidig, extrem lang und trotz der Tiefe erstaunlich frisch. Genau so stelle ich mir einen großen Prestige-Champagner vor.",character:["Präzise","Seidig","Mineralisch","Komplex","Frisch"],aroma:{"Primär":"Zitrone · Clementine · Geißblatt","Sekundär":"Frische Haselnuss · Mandel · frische Butter","Reife":"Honig · kandierte Zitrone"},facts:{grapes:["58 % Chardonnay","42 % Pinot Noir"],vintages:["2012 – 65 %","2008 – 25 %","2007 – 10 %"],crus:"8 Grands Crus",aging:"10 Jahre Hefelager",agingNote:"gilt für die 0,75-l-Flasche"},conclusion:"Ein Prestige-Champagner für alle, die mehr Präzision als Show suchen. Viel Tiefe, aber nie schwer. Für mich besonders stark zu Hummer, Steinbutt, Kaviar oder Trüffel.",perfect:["Frische + Komplexität","Mineralität","große Champagner mit Tiefe","Champagner als Essensbegleiter"]}};const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));function radar(data){const labels=Object.keys(data),values=Object.values(data),cx=300,cy=285,max=205,n=labels.length,point=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]},poly=r=>labels.map((_,i)=>point(i,r).join(",")).join(" "),dataPoly=values.map((v,i)=>point(i,max*v/10).join(",")).join(" ");let grid="";for(let k=2;k<=10;k+=2)grid+='<polygon points="'+poly(max*k/10)+'" fill="none" stroke="#cbd2cf" stroke-width="1"/>';let axes=labels.map((_,i)=>{const p=point(i,max);return'<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#cbd2cf" stroke-width="1"/>'}).join("");let text=labels.map((l,i)=>{const p=point(i,max+34),anchor=Math.abs(p[0]-cx)<10?"middle":p[0]>cx?"start":"end";return'<text class="radar-label" x="'+p[0]+'" y="'+p[1]+'" text-anchor="'+anchor+'" dominant-baseline="middle" fill="#3d4b47" font-size="12" font-weight="700" letter-spacing="1">'+esc(l)+'</text>'}).join("");return'<svg viewBox="0 0 600 570" role="img" aria-label="Winefunday Insight Radar">'+grid+axes+'<polygon points="'+dataPoly+'" fill="rgba(0,68,56,.16)" stroke="#004438" stroke-width="3"/>'+values.map((v,i)=>{const p=point(i,max*v/10);return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#004438"/>'}).join("")+text+'</svg>'}function render(w){const aromas=Object.entries(w.aroma).map(x=>'<div class="card"><small>'+esc(x[0].toUpperCase())+'</small><p>'+esc(x[1])+'</p></div>').join("");return'<header class="hero"><div class="brand">WINEFUNDAY<strong>INSIGHT</strong></div><div class="claim">SERIOUS WINE. NOT SO SERIOUS.</div><p class="producer">'+esc(w.producer)+'</p><h1>'+esc(w.title[0])+'<br>'+esc(w.title[1])+'</h1><div class="meta">'+esc(w.meta)+'</div><div class="rule"></div></header><main><section class="section"><p class="eyebrow">WINEFUNDAY INSIGHT RADAR</p><div class="radar-wrap">'+radar(w.radar)+'</div><p class="radar-note">Winefunday Einschätzung · 0 = niedrig · 10 = ausgeprägt</p><div class="reading"><h3>SO LIEST DU DEN INSIGHT</h3><p>Der Winefunday Insight zeigt nicht, ob ein Wein gut oder schlecht ist. Er zeigt, wie er sich anfühlt: von Frucht und Frische bis zu Körper, Würze und Komplexität. Die Werte sind unsere redaktionelle Einschätzung und keine analytischen Laborwerte.</p></div></section><section class="section"><p class="eyebrow">MEIN EINDRUCK</p><div class="impression">„'+esc(w.impression)+'“</div></section><section class="section"><p class="eyebrow">CHARAKTER</p><div class="chips">'+w.character.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div></section><section class="section"><p class="eyebrow">AROMATIK</p><div class="aroma-grid">'+aromas+'</div></section><section class="section"><p class="eyebrow">DIE FAKTEN</p><div class="facts-grid"><div class="fact-block"><strong>'+w.facts.grapes.map(esc).join("<br>")+'</strong></div><div class="fact-block"><small>ASSEMBLAGE</small><strong>'+w.facts.vintages.map(esc).join("<br>")+'</strong></div><div class="fact-block"><strong>'+esc(w.facts.crus)+'</strong></div><div class="fact-block"><strong>'+esc(w.facts.aging)+'</strong><small>('+esc(w.facts.agingNote)+')</small></div></div></section><section class="finale"><p class="eyebrow">WINEFUNDAY FAZIT</p><blockquote>„'+esc(w.conclusion)+'“</blockquote><div class="perfect"><strong>PERFEKT WENN DU SUCHST:</strong><ul>'+w.perfect.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div></section><div class="bottom-nav"><a href="index.html">ZURÜCK ZUR WEINKARTE</a></div></main>'}const params=new URLSearchParams(location.search),id=params.get("id"),wine=insights[id],app=document.getElementById("app"),back=document.getElementById("backTop");back.href="index.html?id="+encodeURIComponent(id||"CH806-1-NV");back.addEventListener("click",e=>{if(history.length>1){e.preventDefault();history.back()}});app.innerHTML=wine?render(wine):'<div class="empty"><h1>Für diesen Wein ist noch kein Winefunday Insight verfügbar.</h1><a href="index.html">ZURÜCK ZUR WEINKARTE</a></div>';</script></body></html>
