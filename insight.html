<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#004438">
  <title>Winefunday Insight</title>
  <style>
    :root{--green:#004438;--ivory:#F9F6F3;--gold:#b3772d;--ink:#26332f;--muted:#66736e;--line:#d7ddda;--white:#fff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--ivory);color:var(--ink);font-family:Candara,Optima,"Segoe UI",Arial,sans-serif;line-height:1.65}
    .shell{width:min(1040px,calc(100% - 40px));margin:auto}
    .topbar{padding:28px 0}
    .back{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em;text-decoration:none}
    .hero{padding:54px 0 72px;text-align:center}
    .brand{color:var(--green);font-size:14px;font-weight:700;letter-spacing:.28em;line-height:1.2}
    .brand strong{display:block;margin-top:4px;font-size:42px;font-weight:700;letter-spacing:.14em}
    .claim{margin:14px 0 48px;color:var(--muted);font-size:11px;letter-spacing:.16em}
    .producer{margin:0;color:var(--muted);font-size:17px}
    h1{margin:14px 0 12px;color:var(--green);font-family:Optima,Candara,"Segoe UI",Arial,sans-serif;font-size:clamp(38px,7vw,72px);font-weight:500;line-height:.98;letter-spacing:.035em}
    .meta{color:var(--muted);letter-spacing:.08em}
    .rule{height:1px;margin-top:46px;background:var(--line)}
    main{padding-bottom:76px}
    .section{padding:62px 0;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 24px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.16em}
    .radar-panel{padding:38px 28px 28px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px}
    .radar{width:min(760px,100%);margin:auto}
    .radar svg{display:block;width:100%;height:auto;overflow:visible}
    .radar-note{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}
    .reading{max-width:800px;margin:32px auto 0;padding:22px 26px;border-left:2px solid var(--green);background:rgba(227,232,229,.5)}
    .reading h2{margin:0 0 8px;color:var(--green);font-size:12px;letter-spacing:.14em}
    .reading p{margin:0;color:#53605b;font-size:14px}
    .impression{max-width:820px;margin:auto;color:#34443f;font-family:Optima,Candara,"Segoe UI",Arial,sans-serif;font-size:clamp(22px,3vw,30px);line-height:1.55}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{padding:9px 15px;border:1px solid #bfc8c4;border-radius:999px;color:#42524d;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card{padding:26px;background:rgba(255,255,255,.68);border:1px solid var(--line);border-top:2px solid var(--green)}
    .card small,.fact small{display:block;margin-bottom:10px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em}
    .card p{margin:0}
    .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    .fact{padding:26px;background:rgba(255,255,255,.58);border-top:2px solid var(--green)}
    .fact strong{display:block;color:var(--green);font-size:21px;font-weight:500;line-height:1.45}
    .finale{margin-top:58px;padding:44px;background:var(--green);color:var(--white)}
    .finale .eyebrow{color:#dbe7e2}
    .finale blockquote{margin:0 0 34px;font-family:Optima,Candara,"Segoe UI",Arial,sans-serif;font-size:clamp(21px,3vw,29px);line-height:1.5}
    .perfect{display:grid;grid-template-columns:1fr 2fr;gap:28px;padding-top:26px;border-top:1px solid rgba(255,255,255,.28)}
    .perfect strong{font-size:12px;letter-spacing:.13em}
    .perfect ul{margin:0;padding-left:18px}
    .bottom{padding:38px 0;text-align:center}
    .bottom a,.empty a{display:inline-block;padding:12px 20px;border:1px solid var(--green);border-radius:5px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em;text-decoration:none}
    .empty{padding:120px 0;text-align:center}
    .empty h1{font-size:clamp(30px,5vw,48px)}
    @media(max-width:720px){.shell{width:min(100% - 24px,1040px)}.topbar{padding:20px 0}.hero{padding:28px 0 48px}.brand strong{font-size:32px}.claim{margin-bottom:34px}.section{padding:42px 0}.radar-panel{padding:18px 4px 16px}.grid,.facts,.perfect{grid-template-columns:1fr}.radar-label{font-size:9px;letter-spacing:.4px}.impression{font-size:21px}.finale{padding:30px 22px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar"><a class="back" id="backTop" href="index.html?id=CH806-1-NV">← ZURÜCK ZUM WEIN</a></div>
    <div id="app"></div>
  </div>
  <script>
    const insights = {
      "CH806-1-NV": {
        producer: "Laurent-Perrier",
        title: ["GRAND SIÈCLE", "ITÉRATION N°26"],
        meta: "Champagne · 0,75 l",
        radar: { "FRUCHT": 8, "FRISCHE": 9, "SÄURE": 8, "KÖRPER": 7, "STRUKTUR": 6, "HOLZ": 3, "WÜRZE": 6, "KOMPLEXITÄT": 10 },
        impression: "Grand Siècle N°26 ist für mich einer dieser Champagner, bei denen nicht Kraft, sondern Präzision beeindruckt. Zitrone und Clementine kommen zuerst, danach Haselnuss, Mandel, etwas Honig und diese sehr feine mineralische Spannung. Seidig, extrem lang und trotz der Tiefe erstaunlich frisch. Genau so stelle ich mir einen großen Prestige-Champagner vor.",
        character: ["Präzise", "Seidig", "Mineralisch", "Komplex", "Frisch"],
        aroma: { "Primär": "Zitrone · Clementine · Geißblatt", "Sekundär": "Frische Haselnuss · Mandel · frische Butter", "Reife": "Honig · kandierte Zitrone" },
        facts: { grapes: ["58 % Chardonnay", "42 % Pinot Noir"], vintages: ["2012 – 65 %", "2008 – 25 %", "2007 – 10 %"], crus: "8 Grands Crus", aging: "10 Jahre Hefelager", agingNote: "gilt für 0,75 l" },
        conclusion: "Ein Prestige-Champagner für alle, die mehr Präzision als Show suchen. Viel Tiefe, aber nie schwer. Für mich besonders stark zu Hummer, Steinbutt, Kaviar oder Trüffel.",
        perfect: ["Frische + Komplexität", "Mineralität", "große Champagner mit Tiefe", "Champagner als Essensbegleiter"]
      }
    };

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => char === "&" ? "&amp;" : char === "<" ? "&lt;" : char === ">" ? "&gt;" : char.charCodeAt(0) === 34 ? "&quot;" : "&#39;");

    function radar(data) {
      const labels = Object.keys(data), values = Object.values(data), cx = 350, cy = 330, radius = 210, count = labels.length;
      const point = (index, distance) => { const angle = -Math.PI / 2 + index * 2 * Math.PI / count; return [cx + Math.cos(angle) * distance, cy + Math.sin(angle) * distance]; };
      const polygon = distance => labels.map((_, index) => point(index, distance).join(",")).join(" ");
      const dataPolygon = values.map((value, index) => point(index, radius * value / 10).join(",")).join(" ");
      let grid = "";
      for (let step = 2; step <= 10; step += 2) grid += '<polygon points="' + polygon(radius * step / 10) + '" fill="none" stroke="#cbd2cf" stroke-width="1"/>';
      const axes = labels.map((_, index) => { const p = point(index, radius); return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#cbd2cf" stroke-width="1"/>'; }).join("");
      const text = labels.map((label, index) => { const p = point(index, radius + 48), anchor = Math.abs(p[0] - cx) < 10 ? "middle" : p[0] > cx ? "start" : "end"; return '<text class="radar-label" x="' + p[0] + '" y="' + p[1] + '" text-anchor="' + anchor + '" dominant-baseline="middle" fill="#3d4b47" font-size="12" font-weight="700" letter-spacing="1">' + esc(label) + '</text>'; }).join("");
      const dots = values.map((value, index) => { const p = point(index, radius * value / 10); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#004438"/>'; }).join("");
      return '<svg viewBox="0 0 700 680" role="img" aria-label="Winefunday Insight Radar">' + grid + axes + '<polygon points="' + dataPolygon + '" fill="rgba(0,68,56,.16)" stroke="#004438" stroke-width="3"/>' + dots + text + '</svg>';
    }

    function render(wine) {
      const aromas = Object.entries(wine.aroma).map(([label, text]) => '<div class="card"><small>' + esc(label.toUpperCase()) + '</small><p>' + esc(text) + '</p></div>').join("");
      return '<header class="hero"><div class="brand">WINEFUNDAY<strong>INSIGHT</strong></div><div class="claim">SERIOUS WINE. NOT SO SERIOUS.</div><p class="producer">' + esc(wine.producer) + '</p><h1>' + esc(wine.title[0]) + '<br>' + esc(wine.title[1]) + '</h1><div class="meta">' + esc(wine.meta) + '</div><div class="rule"></div></header><main><section class="section"><p class="eyebrow">WINEFUNDAY INSIGHT RADAR</p><div class="radar-panel"><div class="radar">' + radar(wine.radar) + '</div><p class="radar-note">WINEFUNDAY-Einschätzung · 0 = niedrig · 10 = ausgeprägt</p></div><div class="reading"><h2>SO LIEST DU DEN INSIGHT</h2><p>Der Winefunday Insight zeigt nicht, ob ein Wein gut oder schlecht ist. Er zeigt, wie er sich anfühlt: von Frucht und Frische bis zu Körper, Würze und Komplexität. Die Werte sind unsere redaktionelle Einschätzung und keine analytischen Laborwerte.</p></div></section><section class="section"><p class="eyebrow">MEIN EINDRUCK</p><div class="impression">„' + esc(wine.impression) + '“</div></section><section class="section"><p class="eyebrow">CHARAKTER</p><div class="chips">' + wine.character.map(item => '<span class="chip">' + esc(item) + '</span>').join("") + '</div></section><section class="section"><p class="eyebrow">AROMATIK</p><div class="grid">' + aromas + '</div></section><section class="section"><p class="eyebrow">DIE FAKTEN</p><div class="facts"><div class="fact"><strong>' + wine.facts.grapes.map(esc).join("<br>") + '</strong></div><div class="fact"><small>ASSEMBLAGE</small><strong>' + wine.facts.vintages.map(esc).join("<br>") + '</strong></div><div class="fact"><strong>' + esc(wine.facts.crus) + '</strong></div><div class="fact"><strong>' + esc(wine.facts.aging) + '</strong><small>' + esc(wine.facts.agingNote) + '</small></div></div></section><section class="finale"><p class="eyebrow">WINEFUNDAY FAZIT</p><blockquote>„' + esc(wine.conclusion) + '“</blockquote><div class="perfect"><strong>PERFEKT WENN DU SUCHST:</strong><ul>' + wine.perfect.map(item => '<li>' + esc(item) + '</li>').join("") + '</ul></div></section><div class="bottom"><a href="index.html">ZURÜCK ZUR WEINKARTE</a></div></main>';
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const wine = insights[id];
    const app = document.getElementById("app");
    const back = document.getElementById("backTop");
    back.href = "index.html?id=" + encodeURIComponent(id || "CH806-1-NV");
    back.addEventListener("click", event => { if (history.length > 1) { event.preventDefault(); history.back(); } });
    app.innerHTML = wine ? render(wine) : '<div class="empty"><h1>Für diesen Wein ist noch kein Winefunday Insight verfügbar.</h1><a href="index.html">ZURÜCK ZUR WEINKARTE</a></div>';
  </script>
</body>
</html>
